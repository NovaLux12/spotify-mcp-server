name: Publish

# Release-please tags do not trigger workflows when created with GITHUB_TOKEN.
# release.yml explicitly dispatches this workflow for a newly-created tag;
# a maintainer can also recover with:
#   gh workflow run publish.yml --ref v<version> -f tag=v<version>
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact v-prefixed release tag to publish (must equal the selected ref)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance + trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag and package versions
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" || "${GITHUB_REF:-}" != refs/tags/v* ]]; then
            echo "publish requires a v* tag; refusing ref ${GITHUB_REF:-<unset>}" >&2
            exit 1
          fi
          tag="${GITHUB_REF#refs/tags/}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch && "${REQUESTED_TAG:-}" != "$tag" ]]; then
            echo "manual dispatch tag must exactly match the selected ref: ${REQUESTED_TAG:-<missing>} != $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"
          server_version="$(node -p "require('./server.json').version")"
          server_package_version="$(node -p "require('./server.json').packages[0].version")"
          if [[ "$package_version" != "$version" || "$server_version" != "$version" || "$server_package_version" != "$version" ]]; then
            echo "version drift: tag=$version package=$package_version server=$server_version server_package=$server_package_version" >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm test

      - name: Verify packed artifact has a shebang
        shell: bash
        run: |
          set -euo pipefail
          pack_json="$(npm pack --json --pack-destination "$RUNNER_TEMP")"
          tarball="$(node -e 'const fs=require("fs"); const rows=JSON.parse(fs.readFileSync(0,"utf8")); process.stdout.write(rows[0].filename)' <<< "$pack_json")"
          first_line="$(tar -xOf "$RUNNER_TEMP/$tarball" package/dist/index.js | sed -n '1p')"
          test "$first_line" = '#!/usr/bin/env node'

      - name: Publish to npm (trusted publishing / NPM_TOKEN fallback)
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if npm view "@novalux12/spotify-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "@novalux12/spotify-mcp@$VERSION already on npm — skipping"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-mcp-registry:
    runs-on: ubuntu-latest
    # Sized against the worst case the retry step can reach, not the common one:
    # ~70s setup + 10 x 90s attempts + 9 x 30s sleeps = ~21 min. A limit below
    # that ends the job with "cancelled due to timeout" — the same unhelpful
    # answer this step exists to replace, just reached a different way. 25
    # leaves ~4 min of margin.
    timeout-minutes: 25
    needs: publish-npm
    permissions:
      contents: read
      id-token: write # GitHub OIDC auth for the MCP Registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Sync server.json version from tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher (version-pinned, checksum-verified)
        run: |
          MCP_PUBLISHER_VERSION=v1.8.1
          curl -sSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xz mcp-publisher -f mcp-publisher.tar.gz

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        shell: bash
        # `needs: publish-npm` orders the two jobs; it does not make the release
        # visible. mcp-publisher resolves the npm artifact server-side, so a
        # version published seconds earlier comes back as a 400
        # "was not found (status: 404)" — a propagation window, not a broken
        # release. Retrying inside the job is the fix; a genuine auth or
        # validation failure still fails the job, just later and with the last
        # error preserved (#1126).
        #
        # Every failure is retried identically, on purpose. Telling propagation
        # lag apart from a bad OIDC token or a schema rejection would mean
        # matching on the publisher's error text, which this repo does not pin —
        # so the classifier would rot silently the first time that text changed.
        # Ten identical attempts cost minutes, and only on a release.
        run: |
          set -euo pipefail
          max_attempts=10
          # A hung publisher would otherwise block the loop indefinitely and the
          # job would end on the job-level timeout with no reason given. The
          # budget above assumes each attempt is bounded by this.
          attempt_timeout=90
          last_error=""
          last_status=""
          for attempt in $(seq 1 "$max_attempts"); do
            set +e
            output="$(timeout "$attempt_timeout" ./mcp-publisher publish 2>&1)"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "$output"
              echo "registry publish succeeded on attempt $attempt/$max_attempts"
              exit 0
            fi
            last_error="$output"
            last_status="$status"
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "attempt $attempt/$max_attempts failed (exit $status) — npm propagation may be lagging, retrying in 30s" >&2
              if [ -n "$output" ]; then printf '%s\n' "$output" | tail -n 20 >&2; else echo "(no output)" >&2; fi
              sleep 30
            fi
          done
          # Annotation on stdout: GitHub parses workflow commands from both
          # streams, but stdout is the documented channel and is what older
          # runners scanned.
          echo "::error::registry publish failed after $max_attempts attempts (last exit $last_status)"
          if [ -n "$last_error" ]; then
            echo "Last error:" >&2
            printf '%s\n' "$last_error" >&2
          else
            echo "The last attempt produced no output at all, so there is no error to report." >&2
            echo "If it exited 124, mcp-publisher exceeded the ${attempt_timeout}s per-attempt timeout." >&2
          fi
          echo "If @novalux12/spotify-mcp is on npm, this is most likely propagation lag rather than a" >&2
          echo "bad release. Cheapest recovery is to re-run this job only:" >&2
          echo "  gh run rerun ${{ github.run_id }} --failed" >&2
          echo "A rerun gets its own run id, so use the new one if that also fails." >&2
          exit 1
