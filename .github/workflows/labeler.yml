name: PR Labeler

on: [pull_request_target]

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # Official actions/labeler only — pull_request_target runs with access to
      # secrets, so no third-party labeling actions may be introduced here.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
