name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .github/release-please-manifest.json

      # Placeholder: publish to npm is intentionally NOT wired up yet.
      # Trusted publishing (npm OIDC) and/or an NPM_TOKEN secret must be
      # configured before adding a publish job here. When ready, add a step
      # gated on the release-please outputs, e.g.:
      #
      #   - id: release
      #     uses: google-github-actions/release-please-action@v4
      #   - if: steps.release.outputs.release_created
      #     run: npm publish
      #     env:
      #       NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
