name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Check generated documentation inventory
        run: node scripts/surface-census.mjs --check

      - name: Test with count and coverage gates
        shell: bash
        run: |
          set -euo pipefail
          npm run test:coverage | tee test-results.tap
          test_count="$(sed -n 's/^# tests \([0-9][0-9]*\)$/\1/p' test-results.tap | sed -n '$p')"
          pass_count="$(sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p' test-results.tap | sed -n '$p')"
          fail_count="$(sed -n 's/^# fail \([0-9][0-9]*\)$/\1/p' test-results.tap | sed -n '$p')"
          test -n "$test_count" && test "$test_count" -ge 100
          test -n "$pass_count" && test "$pass_count" -eq "$test_count"
          test -n "$fail_count" && test "$fail_count" -eq 0
          grep -q '^# start of coverage report' test-results.tap
          grep -q '^# end of coverage report' test-results.tap
