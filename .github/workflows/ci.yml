name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # #1629. The suite is TZ-pinned to UTC so the result is a property of the
    # code rather than of the runner's clock. `ubuntu-latest` happens to default
    # to UTC, so this block changes no outcome today -- which is the point. A
    # green run was an accident of the runner's configuration, and a runner
    # image or a self-hosted label that moved to any other zone would have
    # turned it red with nothing in the diff to explain it. Declaring the
    # invariant makes the dependency visible and removable.
    #
    # The two analytics suites (`tools.swarm3analytics`, `tools.libraryanalytics`)
    # set `process.env.TZ` themselves and restore it, asserting identical output
    # across zones on purpose. They are unaffected by this and were left alone:
    # they test the timezone handling, this pins the harness that runs them.
    env:
      TZ: UTC
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test-tree typecheck budget
        # #1408, #1478. `tsconfig.json` includes only `src`, so the typecheck
        # above has never seen a test file, and `tsx` strips types rather than
        # checking them — a test naming a symbol that does not exist runs and
        # passes. The count is baselined rather than zero, and the baseline is
        # required to be a CURRENT measurement of this tree: above it is a
        # regression, below it is slack nobody can spend (a one-directional
        # comparison is what let three dead entries accumulate to the "5 to
        # give back" this job kept reporting as a pass). Re-baseline with
        # `npm run check:tests-typecheck -- --write`; widening the budget takes
        # `--allow-increase "<reason>"`.
        run: npm run check:tests-typecheck

      - name: Payload-shape guard (no `as any` under src/tools)
        # #758. `as any` at a payload boundary is the cast that turns off the
        # check which would otherwise catch a Spotify field rename, so it is
        # gated rather than merely discouraged. Type the payload instead.
        run: node scripts/check-no-explicit-any.mjs

      - name: Test debug-output guard (no stray prints in tests)
        # #664. A console.log left in a test is an assertion that cannot fail,
        # and it lands in CI logs where nobody owns it. Assert on the value or
        # delete the statement. `console.error` / `console.warn` and the
        # capture-and-restore idiom are deliberately allowed.
        run: node scripts/check-no-test-debug-output.mjs

      - name: Test fixture-location guard (no fixtures inside the repository)
        # #1383. A fixture directory created under the repo root survives a kill
        # as an untracked entry, and a dirty `git status --porcelain` is how this
        # repo decides a generated block is stale — so a correct change reads as
        # a stale one, and the natural next step touches a generated block.
        # Root every mkdtemp under tests/ at os.tmpdir().
        run: node scripts/check-no-repo-root-fixtures.mjs

      - name: Config-accessor guard (one home per setting)
        # #1625. `getConfig()` is the single source of truth for the
        # SPOTIFY_MCP_* family, and three tool modules each declared their own
        # module-scope `const FETCH_ALL_CAP = () => getConfig().fetchAllCap` —
        # byte-identical, so the name meant the environment variable AND a local
        # re-binding of it. The suite could not catch a fourth: the ~10 test
        # files that mention FETCH_ALL_CAP all reference the environment VARIABLE
        # in a string, never the constant. This walks src/ for a module-scope
        # binding of a config field, so the next one is a failure here instead of
        # a fourth comment claiming it is the same as the other three.
        run: node scripts/check-no-duplicate-config-accessors.mjs

      - name: Script syntax and import guard
        # #644. The test glob is `tests/*.test.ts`, so a `.mjs` under `scripts/`
        # is never loaded by a test that did not already know about it — and the
        # three live harnesses are the ones a broken script hurts most, because
        # their failure mode is a `timeout: initialize` that names no file. This
        # runs `node --check` over every `scripts/**/*.mjs` and import-smokes
        # `scripts/lib/`, so a typo fails here rather than in an afternoon of
        # bisecting a two-minute run.
        run: npm run lint:scripts

      - name: Documentation link guard
        # #931. A relative link that does not resolve, and a 403 message that
        # sends a reader to a README section which is not there. Measured: with
        # the message pointed at a nonexistent heading, the census, the
        # doc-tool-name gate and the `as any` gate all exited 0 -- this one does
        # not. Remote URLs are out of scope by design; a flaky network check is
        # worse than no check.
        run: node --import tsx/esm scripts/check-doc-links.mjs

      - name: Fetch release tags
        # #932. `actions/checkout` defaults to `fetch-depth: 1` and fetches no
        # tags, so the release-history gate would read an empty tag list and
        # pass without comparing anything. Tags only — the shallow clone the
        # test matrix shares is left as it is.
        #
        # This step and the test step below must agree about whether they run.
        # A step without an `if:` is skipped as soon as any earlier step fails,
        # so without this guard an unrelated red (the typecheck budget, say)
        # silently drops the tag list, and the release-history suite then
        # reports eight failures that all say "no v* tags in this clone" —
        # naming a clone problem where the real problem is a skipped fetch. The
        # test step already runs unless cancelled, so it kept running and kept
        # failing on the tags this step never fetched.
        if: ${{ !cancelled() }}
        run: git fetch --tags --force --quiet

      - name: Release-history check (every tag has a CHANGELOG section)
        # #932. `CHANGELOG.md` is generated, so a tag that never got a section
        # is a release whose history the repository does not record. The gate
        # compares the tags, the changelog headings and package.json; the four
        # releases that can never gain a section are listed with the commit
        # that explains each one, inside the script.
        if: ${{ !cancelled() }}
        run: node scripts/check-release-history.mjs

      - name: Generate finalized surface census
        # #1473. This step *writes* the artifact the gates below it read, so it
        # and they have to agree about when they run. They carry
        # `!cancelled()` so a documentation-inventory failure cannot silence a
        # correctness gate; with this step unguarded, an unrelated red above
        # skipped it. In run `36313342863` that red was the typecheck budget:
        # this step and `Check generated documentation inventory` were both
        # skipped, `.surface-census.json` was never written, and
        # `Check documented tool names` — which is guarded — kept running and
        # failed with `ENOENT: no such file or directory, open
        # '…/.surface-census.json'`. One real failure, and a second that named
        # a documentation regression that was not there.
        #
        # #1487. This used to capture the census with a shell redirect, and a
        # redirect truncates the target *before* the command runs — so a failed
        # census left an artifact behind and the three guarded readers below
        # all read it. A run that fails before printing left a zero-byte file
        # and they reported `SyntaxError: Unexpected end of JSON input`; a run
        # that prints and then fails left a file that *parses* and is not a
        # census, so a reader got past `JSON.parse` and died on an absent field
        # instead. Neither named the census, and neither was the `ENOENT` the
        # `!cancelled()` guard above was written to produce.
        #
        # `--out` makes the writer hold the exit status: the file is installed
        # only when the run succeeded, and a failure leaves nothing at all, so
        # the readers fail on the missing artifact this step's own log explains.
        if: ${{ !cancelled() }}
        run: node scripts/surface-census.mjs --out .surface-census.json

      - name: Check generated documentation inventory
        # The other half of the same pair: a reader of the census. A step with
        # no `if:` is skipped as soon as anything above it fails, so this gate
        # would stop reporting for the rest of the run without saying so.
        if: ${{ !cancelled() }}
        run: npm run check:docs-counts -- --census-file .surface-census.json

      - name: Check documented tool names
        # A documentation-inventory failure must not silence the
        # correctness gate, so these run unless cancelled.
        if: ${{ !cancelled() }}
        run: npm run check:doc-tool-names -- --census-file .surface-census.json

      - name: Registry schema conformance gate
        # #655. `server.json` carries a `$schema` URL, which is an annotation,
        # not a check: nothing was loading it. The only party that validated the
        # manifest was `mcp-publisher`, at publish time, and it answers with an
        # opaque 400 after `npm publish` has already made the release public.
        # Fetched live from the URL the manifest declares rather than vendored,
        # because a vendored copy rots silently and only fails at a release; the
        # accepted cost is that an outage of static.modelcontextprotocol.io
        # turns this step red, and the message names the host so it is
        # attributable. It fails closed -- an unreachable host, a non-JSON body
        # or an unresolvable ajv all exit non-zero rather than reporting a pass.
        #
        # `!cancelled()` for the reason the test step carries it: a failure in
        # a documentation-inventory gate must not silence a correctness gate.
        if: ${{ !cancelled() }}
        run: node scripts/check-server-schema.mjs

      - name: Test with count and coverage gates
        # A documentation-inventory failure must not silence the
        # correctness gate, so these run unless cancelled.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          npm run test:coverage | tee test-results.tap
          test_count="$(sed -n 's/^# tests \([0-9][0-9]*\)$/\1/p' test-results.tap | sed -n '$p')"
          pass_count="$(sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p' test-results.tap | sed -n '$p')"
          fail_count="$(sed -n 's/^# fail \([0-9][0-9]*\)$/\1/p' test-results.tap | sed -n '$p')"
          test -n "$test_count" && test "$test_count" -ge 100
          test -n "$pass_count" && test "$pass_count" -eq "$test_count"
          test -n "$fail_count" && test "$fail_count" -eq 0
          grep -q '^# start of coverage report' test-results.tap
          grep -q '^# end of coverage report' test-results.tap

      - name: Summarise test counts and coverage
        # #1627. The step above enforced the coverage thresholds and then threw
        # the numbers away: the two `grep`s stop at the report's sentinels and
        # the percentages between them are never read, so a run that passed at
        # 75.1% against a 75% floor and a run that passed at 99% are
        # indistinguishable in the log. The counts had the same fate -- they
        # existed only inside `sed` expressions and died with the shell.
        #
        # This publishes them instead. It is deliberately NOT a gate: deciding
        # what a coverage drop should cost is a policy question, and adding an
        # enforcement rule here would turn a reporting fix into a new gate that
        # reddens main on the next unrelated refactor. Every value below is read
        # from `test-results.tap`; none is recomputed, and a missing one prints
        # as "unknown" rather than as a zero that would read like a real
        # measurement.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          tap=test-results.tap
          {
            echo "### Test results (Node ${{ matrix.node-version }}, TZ=${TZ:-unset})"
            echo
            echo "| Metric | Value |"
            echo "| --- | --- |"

            # `field` prints "unknown" rather than nothing when the value is
            # absent. It cannot lean on `|| echo unknown`: a `sed` that matches
            # no line still exits 0, so the fallback never fires and the table
            # gets an empty cell -- which reads as a measurement of nothing
            # rather than as a measurement that was not taken. (Same shape as
            # the two stats.fm bugs in AGENTS.md §6: a value that could not be
            # read, rendered as a plausible one.)
            field() {
              local v
              v="$(sed -n "s/^# $1 \\([0-9][0-9]*\\)\$/\\1/p" "$tap" 2>/dev/null | sed -n '$p')"
              printf '%s' "${v:-unknown}"
            }
            echo "| Tests   | $(field tests) |"
            echo "| Pass    | $(field pass) |"
            echo "| Fail    | $(field fail) |"
            echo "| Skipped | $(field skipped) |"
            echo
            echo "Thresholds: lines ≥75%, functions ≥70%, branches ≥60% (a breach fails the step above)."
            echo

            # The `all files` row is node's own roll-up, so this reports the
            # measured aggregate rather than a number this workflow derived.
            row="$(sed -n 's/^# all files | *\([0-9.]*\) *| *\([0-9.]*\) *| *\([0-9.]*\) *|.*/\1 \2 \3/p' "$tap" 2>/dev/null | sed -n '$p')"
            if [ -n "$row" ]; then
              echo "### Coverage (all files)"
              echo
              echo "| Metric | Measured | Floor |"
              echo "| --- | --- | --- |"
              echo "| Lines     | $(echo "$row" | cut -d' ' -f1)% | 75% |"
              echo "| Branches  | $(echo "$row" | cut -d' ' -f2)% | 60% |"
              echo "| Functions | $(echo "$row" | cut -d' ' -f3)% | 70% |"
            else
              echo "### Coverage"
              echo
              echo "_No \`all files\` coverage row was found in the TAP output._"
            fi
            echo
            echo "Full TAP: \`test-results.tap\`, retained as a run artifact whether this run passed or failed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload TAP results
        # #1627. `test-results.tap` was written and never retained: nothing in
        # any workflow used `upload-artifact`, so the file died with the runner
        # and a red run left no artifact to read. This is the whole of the
        # "enforced then discarded" defect -- the coverage numbers existed for
        # the length of one shell process.
        #
        # `if: ${{ !cancelled() }}` rather than the more obvious
        # `if: always()`. The difference is only the cancelled case, and it is
        # the difference that matters here: a cancelled job's steps are killed
        # mid-write, so an upload from a cancelled run is a truncated file
        # presented as a complete one. `!cancelled()` still covers every case
        # this step exists for -- a red suite, a green suite, and a build that
        # failed before the test step ever ran.
        #
        # It is also the only form this repository accepts. `tests/ci-cascade-
        # guard.test.ts` defines "guarded" as literally carrying `!cancelled()`
        # and asserts that every step from the first guard onward carries one;
        # `always()` is a guard to Actions and invisible to that test, so it
        # would have shipped a red build. Same tail as every gate below.
        #
        # `if-no-files-found: warn` because the file legitimately does not exist
        # when the build fails before the test step, and a hard error there
        # would add a second, misleading failure on top of the first.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-tap-node-${{ matrix.node-version }}
          path: test-results.tap
          if-no-files-found: warn
          retention-days: 14
