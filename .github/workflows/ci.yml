name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Payload-shape guard (no `as any` under src/tools)
        # #758. `as any` at a payload boundary is the cast that turns off the
        # check which would otherwise catch a Spotify field rename, so it is
        # gated rather than merely discouraged. Type the payload instead.
        run: node scripts/check-no-explicit-any.mjs

      - name: Test debug-output guard (no stray prints in tests)
        # #664. A console.log left in a test is an assertion that cannot fail,
        # and it lands in CI logs where nobody owns it. Assert on the value or
        # delete the statement. `console.error` / `console.warn` and the
        # capture-and-restore idiom are deliberately allowed.
        run: node scripts/check-no-test-debug-output.mjs

      - name: Test fixture-location guard (no fixtures inside the repository)
        # #1383. A fixture directory created under the repo root survives a kill
        # as an untracked entry, and a dirty `git status --porcelain` is how this
        # repo decides a generated block is stale — so a correct change reads as
        # a stale one, and the natural next step touches a generated block.
        # Root every mkdtemp under tests/ at os.tmpdir().
        run: node scripts/check-no-repo-root-fixtures.mjs

      - name: Documentation link guard
        # #931. A relative link that does not resolve, and a 403 message that
        # sends a reader to a README section which is not there. Measured: with
        # the message pointed at a nonexistent heading, the census, the
        # doc-tool-name gate and the `as any` gate all exited 0 -- this one does
        # not. Remote URLs are out of scope by design; a flaky network check is
        # worse than no check.
        run: node --import tsx/esm scripts/check-doc-links.mjs

      - name: Fetch release tags
        # #932. `actions/checkout` defaults to `fetch-depth: 1` and fetches no
        # tags, so the release-history gate would read an empty tag list and
        # pass without comparing anything. Tags only — the shallow clone the
        # test matrix shares is left as it is.
        run: git fetch --tags --force --quiet

      - name: Release-history check (every tag has a CHANGELOG section)
        # #932. `CHANGELOG.md` is generated, so a tag that never got a section
        # is a release whose history the repository does not record. The gate
        # compares the tags, the changelog headings and package.json; the four
        # releases that can never gain a section are listed with the commit
        # that explains each one, inside the script.
        run: node scripts/check-release-history.mjs

      - name: Generate finalized surface census
        run: node scripts/surface-census.mjs > .surface-census.json

      - name: Check generated documentation inventory
        run: npm run check:docs-counts -- --census-file .surface-census.json

      - name: Check documented tool names
        # A documentation-inventory failure must not silence the
        # correctness gate, so these run unless cancelled.
        if: ${{ !cancelled() }}
        run: npm run check:doc-tool-names -- --census-file .surface-census.json

      - name: Registry schema conformance gate
        # #655. `server.json` carries a `$schema` URL, which is an annotation,
        # not a check: nothing was loading it. The only party that validated the
        # manifest was `mcp-publisher`, at publish time, and it answers with an
        # opaque 400 after `npm publish` has already made the release public.
        # Fetched live from the URL the manifest declares rather than vendored,
        # because a vendored copy rots silently and only fails at a release; the
        # accepted cost is that an outage of static.modelcontextprotocol.io
        # turns this step red, and the message names the host so it is
        # attributable. It fails closed -- an unreachable host, a non-JSON body
        # or an unresolvable ajv all exit non-zero rather than reporting a pass.
        #
        # `!cancelled()` for the reason the test step carries it: a failure in
        # a documentation-inventory gate must not silence a correctness gate.
        if: ${{ !cancelled() }}
        run: node scripts/check-server-schema.mjs

      - name: Test with count and coverage gates
        # A documentation-inventory failure must not silence the
        # correctness gate, so these run unless cancelled.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          npm run test:coverage | tee test-results.tap
          test_count="$(sed -n 's/^# tests \([0-9][0-9]*\)$/\1/p' test-results.tap | sed -n '$p')"
          pass_count="$(sed -n 's/^# pass \([0-9][0-9]*\)$/\1/p' test-results.tap | sed -n '$p')"
          fail_count="$(sed -n 's/^# fail \([0-9][0-9]*\)$/\1/p' test-results.tap | sed -n '$p')"
          test -n "$test_count" && test "$test_count" -ge 100
          test -n "$pass_count" && test "$pass_count" -eq "$test_count"
          test -n "$fail_count" && test "$fail_count" -eq 0
          grep -q '^# start of coverage report' test-results.tap
          grep -q '^# end of coverage report' test-results.tap
