name: Bug report
description: Report a broken or incorrect tool behavior
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear summary of what went wrong.
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Affected tool family
      options:
        - Playback
        - Search
        - Catalog Lookup
        - Personalization
        - Library
        - Playlists
        - Following
        - Audiobooks
        - Other / not tool-specific (auth, install, server startup)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Ask the assistant to ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error message if there is one.
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client used
      description: e.g. Claude Desktop, Claude Code, OpenClaw, Cursor (with version)
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Server version
      description: Run `npx @novalux12/spotify-mcp --version` or provide the package.json version.
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Include the Node.js version, for example v22.9.0.
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - npx
        - Global npm install
        - From source
        - Other
    validations:
      required: true
  - type: input
    id: artifact
    attributes:
      label: Package or build artifact
      description: Provide the package name/version or source commit/build identifier when applicable.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / stderr output
      description: Paste any relevant logs. Redact tokens and Client IDs before pasting.
      render: text
